name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "WRZAudioConverter.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Check files
        run: |
          echo "========== Repository =========="
          pwd
          ls -la

          echo "========== ZIP =========="
          ls -lh WRZAudioConverter.zip

      - name: Extract project
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q WRZAudioConverter.zip -d project

          echo "========== Extracted project =========="
          find project -maxdepth 5 -type f | sort

      - name: Find Android project
        run: |
          set -e

          SETTINGS_FILE=$(find project \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "找不到 settings.gradle.kts 或 settings.gradle"
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== settings =========="
          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          else
            cat settings.gradle
          fi

          echo ""
          echo "========== root build.gradle.kts =========="
          if [ -f build.gradle.kts ]; then
            cat build.gradle.kts
          fi

          echo ""
          echo "========== app/build.gradle.kts =========="
          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          fi

      - name: Check Gradle
        run: |
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== APK =========="

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WRZMedia-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
