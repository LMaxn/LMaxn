name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "WRZAudioConverter.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check project archive
        run: |
          echo "当前目录："
          pwd
          echo "仓库文件："
          ls -la
          echo "检查 ZIP："
          unzip -l WRZAudioConverter.zip | head -80

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q WRZAudioConverter.zip -d project

          echo "解压后的目录："
          find project -maxdepth 3 -type f | head -100

      - name: Find Android project
        run: |
          set -e

          PROJECT_DIR=$(find project -name settings.gradle.kts -o -name settings.gradle | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "找不到 settings.gradle / settings.gradle.kts"
            echo "当前文件结构："
            find project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "找到 Android 项目：$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 8.10.2

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "APK 文件："
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WRZMedia-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
