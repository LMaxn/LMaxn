name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "WRZAudioConverter.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android 17 SDK
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Check project archive
        run: |
          set -e
          echo "当前目录："
          pwd
          echo "仓库文件："
          ls -la
          echo "检查 ZIP："
          test -f WRZAudioConverter.zip
          unzip -l WRZAudioConverter.zip | head -100

      - name: Extract project
        run: |
          set -e
          rm -rf project
          mkdir -p project
          unzip -q WRZAudioConverter.zip -d project

          echo "解压后的目录："
          find project -maxdepth 5 -type f | head -150

      - name: Find Android project
        run: |
          set -e

          PROJECT_DIR="$(find project -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "找不到 settings.gradle 或 settings.gradle.kts"
            find project -maxdepth 7 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          echo "找到 Android 项目：$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Android project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== settings.gradle.kts / settings.gradle =========="
          if [ -f settings.gradle.kts ]; then cat settings.gradle.kts; fi
          if [ -f settings.gradle ]; then cat settings.gradle; fi

          echo "========== root build.gradle.kts / build.gradle =========="
          if [ -f build.gradle.kts ]; then cat build.gradle.kts; fi
          if [ -f build.gradle ]; then cat build.gradle; fi

          echo "========== app/build.gradle.kts / app/build.gradle =========="
          if [ -f app/build.gradle.kts ]; then cat app/build.gradle.kts; fi
          if [ -f app/build.gradle ]; then cat app/build.gradle; fi

      - name: Generate Gradle Wrapper 9.6.0
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          gradle wrapper --gradle-version 9.6.0 --distribution-type bin

      - name: Check Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          chmod +x gradlew
          echo "========== gradle-wrapper.properties =========="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "========== Gradle version =========="
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== APK 文件 =========="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WRZMedia-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
