name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 下载项目
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: 解压项目
        run: |
          mkdir project
          unzip -q WRZAudioConverter.zip -d project
          echo "项目文件："
          ls -la project

      - name: 修复 Android 编译配置
        working-directory: project
        run: |
          # 添加 DocumentFile 依赖
          sed -i '/implementation("androidx.activity:activity-compose/a\    implementation("androidx.documentfile:documentfile:1.0.1")' app/build.gradle.kts

          # Java 17 / Kotlin 17
          sed -i '/android {/a\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }\
              kotlinOptions {\
                  jvmTarget = "17"\
              }' app/build.gradle.kts

          # 修复 MainActivity.kt 缺少 setContent 导入
          sed -i '/import androidx.activity.ComponentActivity/a import androidx.activity.compose.setContent' app/src/main/java/com/wrz/audioconverter/MainActivity.kt

          echo "========== MainActivity.kt 导入 =========="
          head -n 25 app/src/main/java/com/wrz/audioconverter/MainActivity.kt
          echo "=========================================="

      - name: 生成 Gradle Wrapper
        working-directory: project
        run: |
          gradle wrapper --gradle-version 8.10.2

      - name: 编译 APK
        working-directory: project
        run: |
          ./gradlew assembleDebug

      - name: 保存 APK
        uses: actions/upload-artifact@v4
        with:
          name: WRZAudioConverter
          path: project/app/build/outputs/apk/debug/app-debug.apk
