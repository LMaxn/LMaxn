name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "WRZAudioConverter.zip"
      - ".github/workflows/main.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0"

      - name: Check project archive
        run: |
          echo "当前目录："
          pwd

          echo "仓库文件："
          ls -la

          echo "检查 ZIP："
          unzip -l WRZAudioConverter.zip | head -100

      - name: Extract project
        run: |
          set -e

          rm -rf project
          mkdir project

          unzip -q WRZAudioConverter.zip -d project

          echo "解压后的目录："
          find project -maxdepth 4 -type f | head -150

      - name: Find Android project
        run: |
          set -e

          PROJECT_DIR=$(find project \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "找不到 settings.gradle 或 settings.gradle.kts"
            echo "当前文件结构："
            find project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "找到 Android 项目：$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Android project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== settings.gradle.kts =========="
          if [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          fi

          echo "========== build.gradle.kts =========="
          if [ -f build.gradle.kts ]; then
            cat build.gradle.kts
          fi

          echo "========== app/build.gradle.kts =========="
          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          fi

      - name: Generate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "使用 Gradle 9.6.0"

          gradle wrapper \
            --gradle-version 9.6.0 \
            --distribution-type bin

      - name: Check Gradle version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew

          echo "========== Gradle Wrapper =========="
          cat gradle/wrapper/gradle-wrapper.properties

          echo "========== Gradle Version =========="
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========== APK 文件 =========="

          find . \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WRZMedia-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
